name: Cache Behavior Test
on:
  workflow_dispatch

jobs:
  cache-test:
    runs-on: ubuntu-latest
    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@v4

      - name: 캐시 시도
        id: mycache
        uses: actions/cache@v4
        with:
          # 캐시할 디렉토리 경로
          path: ~/test-cache-data
          # 고유 키: OS 이름 + 고유 문자열 + 워크플로우 파일의 해시값
          key: ${{ runner.os }}-test-${{ hashFiles('.github/workflows/05-cache-behavior.yml') }}
          # key가 일치하지 않을 때 가장 최근 캐시를 가져오기 위한 접두사
          restore-keys: |
            ${{ runner.os }}-test-

      - name: 캐시 결과 확인
        run: |
          echo "cache-hit: ${{ steps.mycache.outputs.cache-hit }}"
          echo "=== 디렉토리 상태 ==="
          ls -al ~/test-cache-data || echo "디렉토리 없음"

      - name: 캐시 미스 시에만 데이터 생성
        if: ${{ steps.mycache.outputs.cache-hit != 'true' }}
        run: |
          echo "캐시 미스 - 새 데이터 생성"
          mkdir -p ~/test-cache-data
          echo "생성 시간: $(date)" > ~/test-cache-data/created.txt
          echo "Run #: ${{ github.run_number }}" >> ~/test-cache-data/created.txt

      - name: 캐시 히트 시 기존 데이터 사용
        if: ${{ steps.mycache.outputs.cache-hit == 'true' }}
        run: |
          echo "캐시 히트 - 기존 데이터 사용"
          cat ~/test-cache-data/created.txt
